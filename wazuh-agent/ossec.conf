<!--
  Wazuh agent: syslog file forwarder only.
  The CHANGE_* placeholders are replaced at container start from the environment
  (cont-init.d/0-wazuh-init in wazuh/wazuh-agent 4.14.x). Do not rename them.
-->
<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>CHANGE_MANAGER_PORT</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_ENROLL_IP</manager_address>
      <port>CHANGE_ENROLL_PORT</port>
      <agent_name>CHANGE_AGENT_NAME</agent_name>
      <groups>CHANGE_AGENT_GROUP</groups>
    </enrollment>
  </client>

  <!-- Raise these if devices burst harder than 500 EPS -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>20000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- Written by rsyslog/rsyslog-collector (WRITE_ALL_FILE=on).
       Static path on purpose. A wildcard would also match the volume's other
       /var/log content and the rotated all.log.N.gz files. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/remote/all.log</location>
    <!-- no = resume from the saved offset after a restart (needs the
         /var/ossec/queue/logcollector volume).
         max-size: if more than this piled up while the agent was down, it skips
         to END instead of replaying. Default is 10M, too small for a collector.
         Keep it above SYSLOG_ROTATE_MB. Upper bound is 2G. -->
    <only-future-events max-size="200M">no</only-future-events>
  </localfile>

  <!-- Everything below would only scan this container's own filesystem -->
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>

  <sca>
    <enabled>no</enabled>
  </sca>

  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>

  <active-response>
    <disabled>yes</disabled>
  </active-response>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
